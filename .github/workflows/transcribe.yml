name: remote-transcribe
on:
  repository_dispatch:
    types: [remote-transcribe]
  workflow_dispatch:
    inputs:
      gist_id:
        description: gist id holding audio parts + meta.json
        required: true

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REMOTE_STT_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve gist id
        run: |
          if [ -n "${{ github.event.client_payload.gist_id }}" ]; then
            echo "GID=${{ github.event.client_payload.gist_id }}" >> "$GITHUB_ENV"
          else
            echo "GID=${{ inputs.gist_id }}" >> "$GITHUB_ENV"
          fi
      - run: pip install -q faster-whisper
      - name: Transcribe and upload transcript.json
        run: python3 .github/workflows/transcribe.py