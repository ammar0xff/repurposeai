# CD: sync main to homie and restart services.
# Setup: repo variable DEPLOY_ENABLED=true + secrets HOMIE_HOST, HOMIE_USER, HOMIE_SSH_KEY.
name: cd
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMIE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOMIE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy
        run: |
          git archive HEAD | gzip | \
            ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519 \
              ${{ secrets.HOMIE_USER }}@${{ secrets.HOMIE_HOST }} \
              "cd ~/repurposeai && tar -xzf - && .venv/bin/pip install -q -e . && .venv/bin/alembic upgrade head && systemctl --user restart repurposeai"
      - name: Health check
        run: |
          sleep 8
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.HOMIE_USER }}@${{ secrets.HOMIE_HOST }} \
            "curl -fsS -m 15 http://127.0.0.1:8001/api/system/health"
