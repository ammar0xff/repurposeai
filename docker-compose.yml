services:
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:///./data/repurposeai.db
      STORAGE_PATH: /srv/data
    volumes: [rpa-data:/srv/data]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/system/health"], interval: 30s, timeout: 10s, retries: 3 }
  worker:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    command: ["python", "-m", "app.workers.daemon"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:///./data/repurposeai.db
      STORAGE_PATH: /srv/data
    volumes: [rpa-data:/srv/data]
    depends_on: [backend]
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  rpa-data:
