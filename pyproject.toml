[project]
name = "repurposeai"
version = "0.1.0"
description = "Local-first AI video content repurposing platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "requests>=2.31",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
vision = ["opencv-python-headless>=4.8", "mediapipe>=0.10", "scenedetect[opencv-headless]>=0.6"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
